<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changelog | Torah Heatmap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --text-color: #1e293b;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        header {
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
            font-weight: 700;
        }

        .back-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .version-entry {
            margin-bottom: 3rem;
        }

        .version-header {
            display: flex;
            align-items: baseline;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .version-number {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-color);
        }

        .version-date {
            color: #64748b;
            font-size: 0.875rem;
        }

        ul {
            margin: 0;
            padding-left: 1.5rem;
        }

        li {
            margin-bottom: 0.5rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Changelog</h1>
            <a href="index.html" class="back-link">← Back to App</a>
        </header>

        <div class="version-entry">
            <div class="version-header">
                <span class="version-number">v0.9</span>
                <span class="version-date">January 21, 2026</span>
            </div>
            <ul>
                <li>Corrected sorting of Exodus parashot (Shemot before Vaera).</li>
                <li>Updated footer credits and links.</li>
                <li>Initial public beta release.</li>
            </ul>
        </div>
    </div>
</body>

</html>
